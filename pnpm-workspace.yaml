packages:
  - "apps/*"
  - "packages/*"

# Sólo estos paquetes pueden correr scripts al instalarse: un paquete
# comprometido no ejecuta código en tu máquina ni en Railway.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - "@tailwindcss/oxide"

# Acelerador nativo opcional de BullMQ: sin él usa la versión en JS.
ignoredBuiltDependencies:
  - msgpackr-extract

overrides:
  # autocannon > hyperid > uuid: GHSA-w5hq-g745-h8pq (sólo desarrollo, pero sin alertas abiertas).
  uuid: ^11.1.1
